# Ambiente de desenvolvimento semelhante ao de produção:
#
#   Nginx → PHP-FPM (Laravel) → MySQL
#                ├→ Redis (cache, sessão opcional, filas)
#                └→ Queue worker / Scheduler
#
# Uso: docker compose up -d   (detalhes em docs/SETUP.md)

x-app: &app
    build:
        context: .
        dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www
    volumes:
        - .:/var/www
    environment:
        - DB_HOST=mysql
        - REDIS_HOST=redis
    depends_on:
        mysql:
            condition: service_healthy
        redis:
            condition: service_healthy
    networks:
        - volunteer-web

services:
    app:
        <<: *app
        container_name: volunteer-web-app

    # Processa jobs da fila (ex.: e-mails de notificação de interesse/aprovação).
    queue:
        <<: *app
        container_name: volunteer-web-queue
        command: php artisan queue:work --tries=3 --backoff=10 --max-time=3600

    # Executa tarefas agendadas (routes/console.php).
    scheduler:
        <<: *app
        container_name: volunteer-web-scheduler
        command: php artisan schedule:work

    nginx:
        image: nginx:stable-alpine
        container_name: volunteer-web-nginx
        restart: unless-stopped
        ports:
            - '${APP_PORT:-8000}:80'
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - volunteer-web

    mysql:
        image: mysql:8.4
        container_name: volunteer-web-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-volunteer_web}
            MYSQL_USER: ${DB_USERNAME:-laravel}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    'localhost',
                    '-u',
                    'root',
                    '-p${DB_ROOT_PASSWORD:-root}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - volunteer-web

    redis:
        image: redis:7-alpine
        container_name: volunteer-web-redis
        restart: unless-stopped
        command: redis-server --appendonly yes
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10
        networks:
            - volunteer-web

    # Servidor Vite com HMR. Opcional: `docker compose --profile dev up -d`.
    # node_modules fica em volume próprio para não sobrescrever o do host.
    vite:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: volunteer-web-vite
        profiles: ['dev']
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
            - vite-node-modules:/var/www/node_modules
        ports:
            - '${VITE_PORT:-5173}:5173'
        command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
        networks:
            - volunteer-web

networks:
    volunteer-web:
        driver: bridge

volumes:
    mysql-data:
        driver: local
    redis-data:
        driver: local
    vite-node-modules:
        driver: local
